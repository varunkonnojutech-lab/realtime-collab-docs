# One-command run:  docker compose up --build
#   Editor UI:   http://localhost:3000
#   API (direct): http://localhost:8080
#
# No keys needed: there is no auth and no external service by design
# (see "Security note" in the README). To override the database path
# or environment, copy .env.example to .env if present, or set the
# variables below inline, and recreate the api service.
services:
  api:
    build:
      context: .
      dockerfile: src/CollabDocs.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # SQLite file on the named volume below. The API creates the
      # /app/data directory and the database file (EF EnsureCreated)
      # on first run.
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Data Source=/app/data/collabdocs.db}
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
